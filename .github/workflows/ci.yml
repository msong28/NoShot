name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run format:check

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test -- --ci

      - run: sudo apt-get update && sudo apt-get install -y postgresql

      # apt's postgresql package doesn't put initdb/postgres/psql on PATH --
      # they live under a version-specific dir, unlike Homebrew locally.
      - run: echo "/usr/lib/postgresql/$(ls /usr/lib/postgresql)/bin" >> "$GITHUB_PATH"

      - run: npm run test:db
